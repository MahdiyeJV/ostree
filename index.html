<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grow the Tree</title>
<meta name="description" content="An interactive game for learning Opportunity Solution Trees and continuous discovery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e8; --surface:#fffdf8; --surface-2:#efe9db; --ink:#1f2a22; --muted:#5d6a60; --line:#d9d1bf;
  --outcome:#2f6b3f; --outcome-bg:#e3efe4;
  --opp:#b5651d; --opp-bg:#fbeedd;
  --sol:#2b6a8f; --sol-bg:#e1eef6;
  --test:#7a4a9a; --test-bg:#efe5f6;
  --good:#2f7a45; --good-bg:#e2f2e6; --warn:#a3700f; --warn-bg:#fbf0d6; --bad:#b03a2e; --bad-bg:#f8e3e0;
  --accent:#2f6b3f; --accent-ink:#fff;
  --shadow:0 1px 2px rgba(30,40,30,.06),0 6px 20px rgba(30,40,30,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a16; --surface:#1c241f; --surface-2:#243029; --ink:#e8ede6; --muted:#9daaa0; --line:#33413a;
    --outcome:#7cc58e; --outcome-bg:#1f3527; --opp:#f0a85e; --opp-bg:#3a2a18; --sol:#7fbde3; --sol-bg:#16303f; --test:#c79ae6; --test-bg:#2e2139;
    --good:#7cc58e; --good-bg:#1d3324; --warn:#e8bd5b; --warn-bg:#3a2f14; --bad:#ef8a7e; --bad-bg:#3d1f1b;
    --accent:#7cc58e; --accent-ink:#0e1a12; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#141a16; --surface:#1c241f; --surface-2:#243029; --ink:#e8ede6; --muted:#9daaa0; --line:#33413a;
  --outcome:#7cc58e; --outcome-bg:#1f3527; --opp:#f0a85e; --opp-bg:#3a2a18; --sol:#7fbde3; --sol-bg:#16303f; --test:#c79ae6; --test-bg:#2e2139;
  --good:#7cc58e; --good-bg:#1d3324; --warn:#e8bd5b; --warn-bg:#3a2f14; --bad:#ef8a7e; --bad-bg:#3d1f1b;
  --accent:#7cc58e; --accent-ink:#0e1a12; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand h1{font-size:1.35rem}
.brand small{display:block;color:var(--muted);font-size:.8rem;font-family:Inter,sans-serif;font-weight:500}
.hud{display:flex;gap:10px;align-items:center}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;display:grid;place-items:center}
.progress{display:flex;gap:4px;margin:0 0 18px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.now{background:var(--opp)}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:6px}
.card h2{font-size:1.5rem;margin-bottom:10px}
.lead{color:var(--muted);margin:0 0 16px}
.scenario{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:.95rem}
.q{font-weight:600;margin:6px 0 12px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s,background .15s,transform .05s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:active:not([disabled]){transform:translateY(1px)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--sol);background:var(--sol-bg)}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.partial{border-color:var(--warn);background:var(--warn-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt .meta{display:block;font-size:.82rem;color:var(--muted);margin-top:6px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;margin-top:8px;font-size:.78rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--opp)}
.feedback{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:.95rem;display:none}
.feedback.show{display:block;animation:pop .2s ease}
.feedback.good{background:var(--good-bg);border-left:4px solid var(--good)}
.feedback.partial{background:var(--warn-bg);border-left:4px solid var(--warn)}
.feedback.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.feedback b{display:block;margin-bottom:2px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sortcard{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;font-family:Fraunces,Georgia,serif;font-size:1.15rem;margin-bottom:14px;background:var(--surface-2);min-height:84px;display:grid;place-items:center}
.counter{font-size:.82rem;color:var(--muted);text-align:center;margin-bottom:8px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.bucket{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:600;font-size:.92rem}
.bucket small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;margin-top:2px}
.bucket:hover:not([disabled]){border-color:var(--accent)}
.bucket.correct{border-color:var(--good);background:var(--good-bg)}
.bucket.wrong{border-color:var(--bad);background:var(--bad-bg)}
.habit{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;font-size:.88rem;color:var(--muted)}
.habit strong{color:var(--ink)}
/* tree panel */
.treepanel{position:sticky;top:16px}
@media (max-width:900px){.treepanel{position:static}}
.treepanel h3{font-size:1.1rem;margin-bottom:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin:6px 0 12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.treescroll{overflow-x:auto;padding:4px 0 8px}
.treefit{transform-origin:top left}
.tree{display:flex;flex-direction:column;align-items:center;width:max-content;margin:0 auto}
.tree ul{display:flex;justify-content:center;padding:16px 0 0;margin:0;position:relative;list-style:none}
.tree li{display:flex;flex-direction:column;align-items:center;position:relative;padding:16px 3px 0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;width:50%;height:16px;border-top:1.5px solid var(--line)}
.tree li::before{right:50%}
.tree li::after{left:50%;border-left:1.5px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{border-top:0}
.tree li:only-child{padding-top:16px}
.tree li:first-child::before,.tree li:last-child::after{border-top:0}
.tree li:last-child::before{border-right:1.5px solid var(--line);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree li:only-child::after{border-radius:0}
.tree ul::before{content:"";position:absolute;top:0;left:50%;height:16px;border-left:1.5px solid var(--line)}
.tree>.node+ul::before{}
.node{border-radius:10px;padding:6px 7px;font-size:.72rem;line-height:1.3;width:max-content;max-width:100px;text-align:center;border:1.5px solid;animation:grow .35s ease}
.node.outcome{max-width:220px;font-size:.8rem;font-weight:600;background:var(--outcome-bg);border-color:var(--outcome);color:var(--ink)}
.node.opp{background:var(--opp-bg);border-color:var(--opp)}
.node.parent{font-weight:600}
.node.target{box-shadow:0 0 0 3px var(--opp);font-weight:600}
.node.target::before{content:"🎯 ";}
.node.sol{background:var(--sol-bg);border-color:var(--sol)}
.node.test{background:var(--test-bg);border-color:var(--test)}
.node.empty{border-style:dashed;border-color:var(--line);color:var(--muted);background:transparent}
@keyframes grow{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.parking{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.parking .label{width:100%;text-align:center;font-size:.75rem;color:var(--muted)}
.treeempty{color:var(--muted);font-size:.9rem;text-align:center;padding:30px 10px}
/* intro / end */
.hero{text-align:center;padding:34px 22px}
.hero h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:12px}
.hero p{max-width:620px;margin:0 auto 14px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0;text-align:left}
.step{border-radius:12px;padding:12px;border:1.5px solid var(--c);background:var(--cb)}
.step b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.02rem}
.step span{font-size:.82rem;color:var(--muted)}
.score-big{font-family:Fraunces,Georgia,serif;font-size:3.2rem;font-weight:700;color:var(--accent);line-height:1}
.rank{font-weight:600;margin:6px 0 16px}
.recap{display:grid;gap:6px;text-align:left;max-width:560px;margin:16px auto}
.recap div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0;font-size:.92rem}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="6" r="4.5" fill="var(--outcome)"/><circle cx="7" cy="17" r="4" fill="var(--opp)"/><circle cx="27" cy="17" r="4" fill="var(--opp)"/><circle cx="7" cy="29" r="3.5" fill="var(--sol)"/><circle cx="27" cy="29" r="3.5" fill="var(--test)"/><path d="M17 10.5 7 13M17 10.5 27 13M7 21v4.5M27 21v4.5" stroke="var(--line)" stroke-width="2" fill="none"/></svg>
      <div><h1>Grow the Tree</h1><small>An Opportunity Solution Tree game</small></div>
    </div>
    <div class="hud">
      <span class="pill" id="levelPill">Intro</span>
      <span class="pill" id="scorePill">0 pts</span>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <main id="app"></main>
  <footer>
    An unofficial, fan-made learning game inspired by Teresa Torres's <em>Continuous Discovery Habits</em> and the Opportunity Solution Tree.
    Learn the real thing at <a href="https://www.producttalk.org" target="_blank" rel="noopener">producttalk.org</a>.
  </footer>
</div>

<script>
/* ---------------- Content ---------------- */
const SCENARIO = `You're the product manager at <b>Forkful</b>, a recipe app. Together with your designer and tech lead (your <b>product trio</b>), you've been asked to grow engagement. Build an Opportunity Solution Tree, one layer at a time.`;

const PARENTS = [
  {id:'decide', text:'Deciding what to cook'},
  {id:'shop',   text:'Getting the ingredients'},
  {id:'cook',   text:'Cooking the meal'}
];

const LEVELS = [
  {
    id:'outcome', type:'choice', eyebrow:'Level 1 · The root', title:'Plant the seed: choose your outcome', points:30,
    lead:'Every tree starts with one clear outcome at the root. That outcome is the change in customer behavior your team is responsible for moving.',
    q:'Leadership wants "more engagement". Which outcome should your trio commit to?',
    options:[
      {text:'Launch the new meal-planner feature by the end of Q3', v:'wrong', why:'That\'s an <b>output</b>: something you ship. Shipping a feature tells you nothing about whether it changed customer behavior.'},
      {text:'Increase annual revenue by 15%', v:'partial', why:'That\'s a <b>business outcome</b>. It matters, but it lags and has many causes, so your trio can\'t move it directly. Find the product outcome that drives it.'},
      {text:'Increase the share of active users who cook 3+ Forkful recipes a week', v:'correct', why:'A <b>product outcome</b>: it measures customer behavior, your team can influence it directly, and it should drive the business results.'},
      {text:'Make our users happier', v:'wrong', why:'It\'s a good intention, but you can\'t measure it, so you\'d never know whether you were making progress.'}
    ],
    habit:'<strong>Outcomes over outputs.</strong> Teams that are given outcomes, not feature roadmaps, have room to discover the best way to create value.',
    tree:{outcome:'More active users cook 3+ recipes / week'}
  },
  {
    id:'opps', type:'sort', eyebrow:'Level 2 · Discovering opportunities', title:'Sort the interview notes', pointsEach:10,
    lead:'Your trio interviewed customers this week. Each note below could go on the tree, but only <b>opportunities</b> should: customer needs, pain points and desires, told from the customer\'s point of view.',
    buckets:[
      {id:'opp', label:'Opportunity', hint:'a customer need or pain'},
      {id:'sol', label:'Solution in disguise', hint:'a feature idea'},
      {id:'biz', label:'Company need', hint:'what we want, not them'}
    ],
    cards:[
      {text:'"I never know what to make with what\'s already in my fridge."', a:'opp', why:'A real pain point, in the customer\'s own words.'},
      {text:'"You should add a barcode scanner for groceries."', a:'sol', why:'A feature request. Ask what need sits behind it, because that need is the opportunity.'},
      {text:'"By Tuesday night I\'m too tired for anything complicated."', a:'opp', why:'A need that came out of a specific story. Great for the tree.'},
      {text:'We need more users to finish onboarding.', a:'biz', why:'That\'s our goal, not a need the customer has. Opportunities are framed from the customer\'s point of view.'},
      {text:'"I end up throwing away food I bought."', a:'opp', why:'A pain point that matters to the customer, and one many products could address.'},
      {text:'Send a weekly push notification with recipes.', a:'sol', why:'That\'s one way to solve something. Solutions go below the opportunity they address.'},
      {text:'"I want my kids to actually eat what I cook."', a:'opp', why:'A desire. Opportunities include wants, not just pains.'},
      {text:'Increase time spent in the app.', a:'biz', why:'That\'s a metric we care about, not a need the customer has.'}
    ],
    habit:'<strong>Interview every week.</strong> Ask for specific stories ("Tell me about the last time you cooked dinner") rather than opinions or wish lists. Summarize each interview on a one-page snapshot.',
    tree:{parking:['Nothing to make with fridge leftovers','Too tired for complicated meals','Throwing away food','Kids won\'t eat it']}
  },
  {
    id:'structure', type:'sort', eyebrow:'Level 3 · Structuring the space', title:'Give the opportunities a shape', pointsEach:10,
    lead:'Your experience map shows three key moments in a customer\'s journey. Put each opportunity under the moment where it happens. A child opportunity should be a smaller part of its parent.',
    buckets: PARENTS.map(p=>({id:p.id,label:p.text})),
    cards:[
      {text:'"I don\'t know what to make with what\'s in my fridge."', short:'Nothing to make with what I have', a:'decide', why:'This happens while you\'re picking a meal.'},
      {text:'"I keep cooking the same five meals."', short:'Stuck cooking the same 5 meals', a:'decide', why:'A rut is a problem with <i>choosing</i> what to cook.'},
      {text:'"I forget one ingredient and have to run back to the store."', short:'Forget an ingredient', a:'shop', why:'This one is about getting the ingredients.'},
      {text:'"Grocery shopping eats my whole Saturday."', short:'Shopping takes too long', a:'shop', why:'Also part of getting the ingredients.'},
      {text:'"I lose my place in the recipe when my hands are messy."', short:'Lose my place in the recipe', a:'cook', why:'This happens at the stove, while cooking.'},
      {text:'"Recipes always take longer than they say."', short:'Recipes take longer than promised', a:'cook', why:'A pain point that comes up while cooking.'}
    ],
    habit:'<strong>Map the experience.</strong> When parent opportunities are moments in time, siblings stay distinct and gaps in your understanding become easy to see.'
  },
  {
    id:'target', type:'choice', eyebrow:'Level 4 · Prioritizing', title:'Pick a target opportunity', points:30,
    lead:'You can\'t chase everything. Compare sibling opportunities against each other (not each one alone) and choose one to work on now.',
    q:'Company strategy this year: <i>"Be the most inspiring place to discover what to cook."</i> Which opportunity do you target?',
    options:[
      {key:'rut', text:'"I keep cooking the same five meals"', bars:{Reach:80,Frequency:85,'Strategy fit':95,'Competitors weak':80}, v:'correct', why:'It affects many customers, comes up every week, fits the strategy, and competitors haven\'t solved it. Pursuing it can move your outcome and set you apart.'},
      {key:'forget', text:'"I forget an ingredient"', bars:{Reach:45,Frequency:35,'Strategy fit':25,'Competitors weak':30}, v:'wrong', why:'It\'s a real pain, but it doesn\'t happen often, it\'s far from your strategy, and grocery apps already solve it.'},
      {key:'place', text:'"I lose my place in the recipe"', bars:{Reach:65,Frequency:70,'Strategy fit':45,'Competitors weak':15}, v:'partial', why:'A reasonable choice, but competitors have already solved it. Fixing it is table stakes: you\'d catch up, not stand out.'}
    ],
    habit:'<strong>Compare and contrast.</strong> Weigh opportunities on reach, frequency, market factors, company factors and customer importance. Choose, learn and revisit: decisions on the tree can be undone.'
  },
  {
    id:'solutions', type:'multi', pick:3, eyebrow:'Level 5 · Generating solutions', title:'Pick three solutions to explore', pointsEach:10,
    lead:'Your trio brainstormed lots of ideas. Pick <b>three</b> that address your target opportunity, <i>"I keep cooking the same five meals"</i>. Working on three at once lets you compare them instead of falling in love with one.',
    options:[
      {text:'"Surprise me": one tap for a recipe from a cuisine you\'ve never cooked', ok:true, short:'"Surprise me" button', why:'Directly breaks the rut.'},
      {text:'Hands-free voice mode that reads out each step', ok:false, why:'Addresses "lose my place in the recipe", not your target.'},
      {text:'Weekly themed cook-along challenge with friends', ok:true, short:'Cook-along challenge with friends', why:'Brings new dishes and a little social motivation.'},
      {text:'Auto-generated shopping list', ok:false, why:'Addresses "forget an ingredient", a different branch of the tree.'},
      {text:'"Twist it": swap one ingredient in a meal you already love', ok:true, short:'"Twist it" ingredient swaps', why:'Small, low-effort variety, built on meals people already cook.'},
      {text:'Redesign the settings page', ok:false, why:'This doesn\'t connect to any opportunity on the tree. If an idea doesn\'t map to an opportunity, question it.'},
      {text:'Taste-profile quiz that recommends new dishes', ok:true, short:'Taste-profile recommendations', why:'Points people toward new meals they\'re likely to enjoy.'}
    ],
    habit:'<strong>Avoid "whether or not" decisions.</strong> Asking "should we build X?" invites confirmation bias. Asking "which of these three is best?" makes you test them against each other.'
  },
  {
    id:'assumptions', type:'sort', eyebrow:'Level 6 · Surfacing assumptions', title:'What has to be true?', pointsEach:10,
    lead:'You\'re exploring the <b>cook-along challenge with friends</b>. Before building anything, list the assumptions it depends on. Sort each one by type.',
    buckets:[
      {id:'des', label:'Desirability', hint:'do they want it?'},
      {id:'via', label:'Viability', hint:'is it good for the business?'},
      {id:'fea', label:'Feasibility', hint:'can we build it?'},
      {id:'usa', label:'Usability', hint:'can they use it?'},
      {id:'eth', label:'Ethical', hint:'could it do harm?'}
    ],
    cards:[
      {text:'Customers want to cook the same dish as their friends.', a:'des', why:'Whether people want it at all is a desirability assumption.'},
      {text:'People will find and understand the "Join challenge" button.', a:'usa', why:'Whether people can find and use something is a usability assumption.'},
      {text:'We can match friends from contacts without slowing the app down.', a:'fea', why:'Whether we can build it is a feasibility assumption.'},
      {text:'Challenges will lift weekly cooking enough to be worth the build cost.', a:'via', why:'Whether it\'s worth it for the business is a viability assumption.'},
      {text:'Sharing what people cook won\'t expose sensitive diet or health information.', a:'eth', why:'Potential harm to customers is an ethical assumption.'}
    ],
    habit:'<strong>Test assumptions, not whole ideas.</strong> Story-map the solution, then ask what has to be true at each step. Testing small assumptions is faster than building the whole thing.'
  },
  {
    id:'riskiest', type:'choice', eyebrow:'Level 7 · Assumption mapping', title:'Find the leap of faith', points:30,
    lead:'Put each assumption on a map of <b>how important</b> it is versus <b>how much evidence</b> you have. Test the top-left corner first: important assumptions with the least evidence.',
    q:'Which assumption should you test first?',
    options:[
      {text:'Customers want to cook the same dish as their friends', meta:'Importance: critical · Evidence: none. Not one interviewee has mentioned cooking socially.', v:'correct', why:'Critical and completely unproven. If it\'s false, nothing else about the idea matters.'},
      {text:'People will find the "Join challenge" button', meta:'Importance: medium · Evidence: little, but it\'s easy to fix after launch', v:'wrong', why:'It matters, but you can fix it cheaply later. It isn\'t a leap of faith.'},
      {text:'We can match friends from contacts', meta:'Importance: high · Evidence: strong. Engineering built this for another feature.', v:'wrong', why:'You already have strong evidence. Testing it again wastes a cycle.'},
      {text:'Challenges will lift weekly cooking enough to pay off', meta:'Importance: high · Evidence: none', v:'partial', why:'It\'s risky too, but it depends on desirability. If nobody wants it, viability is moot, so test desirability first.'}
    ],
    habit:'<strong>Assumption mapping.</strong> Sort assumptions by importance and evidence so you spend your testing time where the risk is highest.'
  },
  {
    id:'test', type:'choice', eyebrow:'Level 8 · Testing', title:'Design a fast, honest test', points:30,
    lead:'Your leap of faith is <i>"Customers want to cook the same dish as their friends."</i> Choose the best way to test it this week.',
    q:'Which test do you run?',
    options:[
      {text:'Ask 20 customers: "Would you join a cooking challenge with friends?"', v:'wrong', why:'People are bad at predicting what they will do. Ask about what they <b>did</b>, not what they <i>would</i> do.'},
      {text:'Build the full feature and A/B test it', v:'wrong', why:'Too slow and expensive. If the assumption is wrong you\'ve wasted weeks. Test the assumption, not the whole idea.'},
      {text:'One-question survey: "When did you last cook a meal with or for friends?" Success = 30%+ in the past month, agreed before sending.', v:'correct', why:'It asks about past behavior, it\'s fast, and the success criteria are set in advance so you can\'t move the goalposts.'},
      {text:'Add a fake "Join a challenge" button and see how many people click', v:'partial', why:'A good kind of test, but you never said in advance what click rate counts as success, so any result could be argued either way.'},
      {text:'Debate it with stakeholders until everyone agrees', v:'wrong', why:'Opinions aren\'t evidence. Go and collect data instead.'}
    ],
    habit:'<strong>Small, fast, iterative tests.</strong> Agree on success criteria before you run a test. Many small tests beat one big bet.'
  }
];

/* ---------------- State ---------------- */
const MAX = LEVELS.reduce((s,l)=> s + (l.type==='choice'? l.points : l.type==='multi'? l.pick*l.pointsEach : l.cards.length*l.pointsEach), 0);
let S;
function fresh(){
  return {level:-1, score:0, perLevel:{}, placed:{}, target:null, solutions:[], done:false};
}
S = fresh();

const app = document.getElementById('app');
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc = s => s; // content is authored, trusted

/* ---------------- Theme ---------------- */
(function(){
  const root=document.documentElement;
  let saved=null; try{saved=localStorage.getItem('ost-theme')}catch(e){}
  if(saved) root.setAttribute('data-theme',saved);
  document.getElementById('themeBtn').onclick=()=>{
    const cur=root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const next=cur==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('ost-theme',next)}catch(e){}
  };
})();

/* ---------------- HUD ---------------- */
function hud(){
  document.getElementById('scorePill').textContent = `${S.score} / ${MAX} pts`;
  document.getElementById('levelPill').textContent = S.done ? 'Complete' : S.level<0 ? 'Intro' : `Level ${S.level+1} of ${LEVELS.length}`;
  const p=document.getElementById('progress'); p.innerHTML='';
  LEVELS.forEach((_,i)=>{const s=document.createElement('span'); if(S.done||i<S.level) s.className='done'; else if(i===S.level) s.className='now'; p.appendChild(s);});
}
function addScore(levelId, pts){ S.score+=pts; S.perLevel[levelId]=(S.perLevel[levelId]||0)+pts; hud(); }

/* ---------------- Tree rendering ---------------- */
function treeHTML(){
  const L = S.done ? LEVELS.length : S.level; // number of completed levels
  if(L<1) return `<div class="treeempty">Your tree is just a seed.<br>Finish a level to watch it grow.</div>`;
  let h = `<div class="tree"><div class="node outcome">${LEVELS[0].tree.outcome}</div>`;
  if(L===2 || (L>=2 && L<3)){
    h += `</div><div class="parking"><div class="label">Opportunities found (not yet structured)</div>${LEVELS[1].tree.parking.map(t=>`<div class="node opp">${t}</div>`).join('')}</div>`;
    return h;
  }
  if(L>=3){
    const structure = LEVELS[2].cards;
    h += `<ul>${PARENTS.map(p=>{
      const kids = structure.filter(c=>c.a===p.id);
      return `<li><div class="node opp parent">${p.text}</div><ul>${kids.map(k=>{
        const isTarget = L>=4 && k.a==='decide' && k.short.startsWith('Stuck');
        let sub='';
        if(isTarget && L>=5){
          sub = `<ul>${S.solutions.map(s=>{
            let tests='';
            if(L>=7 && s.startsWith('Cook-along')){
              tests = `<ul><li><div class="node test">${L>=8?'Survey: cooked with friends last month? (≥30%)':'Leap of faith: people want to cook with friends'}</div></li></ul>`;
            }
            return `<li><div class="node sol">${s}</div>${tests}</li>`;
          }).join('')}</ul>`;
        }
        return `<li><div class="node opp${isTarget?' target':''}">${k.short}</div>${sub}</li>`;
      }).join('')}</ul></li>`;
    }).join('')}</ul>`;
  }
  return h + `</div>`;
}
function treePanel(){
  return `<aside class="card treepanel" aria-label="Your opportunity solution tree">
    <h3>Your tree</h3>
    <div class="legend"><span style="--c:var(--outcome)">Outcome</span><span style="--c:var(--opp)">Opportunity</span><span style="--c:var(--sol)">Solution</span><span style="--c:var(--test)">Assumption test</span></div>
    <div class="treescroll"><div class="treefit">${treeHTML()}</div></div>
  </aside>`;
}


/* scale the tree to fit its panel (down to 60%), scroll beyond that */
function fitTree(){
  document.querySelectorAll('.treescroll').forEach(sc=>{
    const fitEl=sc.querySelector('.treefit'), tree=sc.querySelector('.tree'); if(!fitEl||!tree) return;
    fitEl.style.transform=''; sc.style.height='';
    const avail=sc.clientWidth, w=tree.scrollWidth, h=tree.scrollHeight;
    const k=Math.max(.5, Math.min(1, avail/w));
    fitEl.style.transform=`scale(${k})`;
    fitEl.style.width = w+'px';
    fitEl.style.marginLeft = (w*k<avail) ? ((avail-w*k)/2)+'px' : '0';
    sc.style.height=(h*k+12)+'px';
    const t=sc.querySelector('.target')||sc.querySelector('.outcome');
    if(w*k>avail && t){ const r=t.getBoundingClientRect(), sr=sc.getBoundingClientRect(); sc.scrollLeft += (r.left+r.width/2)-(sr.left+sr.width/2); }
  });
}
addEventListener('resize', fitTree);

/* ---------------- Screens ---------------- */
function render(){
  hud();
  window.scrollTo({top:0,behavior:'smooth'});
  if(S.level<0) return intro();
  if(S.done) return finish();
  const lv = LEVELS[S.level];
  app.innerHTML = `<div class="grid"><section class="card" id="play"></section>${treePanel()}</div>`;
  const play = document.getElementById('play');
  play.innerHTML = `<div class="eyebrow">${lv.eyebrow}</div><h2>${lv.title}</h2>
    ${S.level===0?`<div class="scenario">${SCENARIO}</div>`:''}
    <p class="lead">${lv.lead}</p><div id="body"></div>
    <div class="habit">💡 ${lv.habit}</div>`;
  const body = play.querySelector('#body');
  ({choice:playChoice, sort:playSort, multi:playMulti})[lv.type](lv, body);
  requestAnimationFrame(fitTree);
}

function intro(){
  app.innerHTML = `<section class="card hero">
    <div class="eyebrow">Continuous discovery, one branch at a time</div>
    <h2>Can you grow a healthy<br>Opportunity Solution Tree?</h2>
    <p>An Opportunity Solution Tree is a visual way to connect the work you do to the outcome you're trying to move. You'll build one for a fictional recipe app across 8 short levels.</p>
    <div class="steps">
      <div class="step" style="--c:var(--outcome);--cb:var(--outcome-bg)"><b>Outcome</b><span>The customer behavior change you're aiming for</span></div>
      <div class="step" style="--c:var(--opp);--cb:var(--opp-bg)"><b>Opportunities</b><span>Customer needs, pains and desires you hear in interviews</span></div>
      <div class="step" style="--c:var(--sol);--cb:var(--sol-bg)"><b>Solutions</b><span>Ideas that address one target opportunity</span></div>
      <div class="step" style="--c:var(--test);--cb:var(--test-bg)"><b>Assumption tests</b><span>Quick experiments on the riskiest assumptions</span></div>
    </div>
    <p>Score points for getting things right the first time. Wrong answers explain why, so you'll learn either way.</p>
    <div class="actions" style="justify-content:center"><button class="btn" id="start">Start planting 🌱</button></div>
  </section>`;
  document.getElementById('start').onclick=()=>{S.level=0;render();};
}

function nextBtn(container, label='Next level →'){
  const a = $(`<div class="actions"><button class="btn">${S.level===LEVELS.length-1?'See your tree 🌳':label}</button></div>`);
  a.querySelector('button').onclick=()=>{ if(S.level===LEVELS.length-1){S.done=true;} else S.level++; render(); };
  container.appendChild(a);
  a.querySelector('button').focus({preventScroll:true});
}
function fb(kind, title, text){ return `<div class="feedback show ${kind}" role="status"><b>${title}</b>${text}</div>`; }

/* choice: single answer; first-try correct = full, partial = half; retry allowed */
function playChoice(lv, body){
  let attempts=0, finished=false;
  body.innerHTML = `<div class="q">${lv.q}</div><div class="opts"></div><div class="fbx"></div>`;
  const opts = body.querySelector('.opts'), fbx = body.querySelector('.fbx');
  lv.options.forEach((o)=>{
    const bars = o.bars ? `<div class="bars">${Object.entries(o.bars).map(([k,v])=>`<span>${k}</span><div class="bar"><i style="width:${v}%"></i></div>`).join('')}</div>` : '';
    const b = $(`<button class="opt"><span>${o.text}</span>${o.meta?`<span class="meta">${o.meta}</span>`:''}${bars}</button>`);
    b.onclick=()=>{
      if(finished || b.disabled) return;
      attempts++;
      if(o.v==='correct'){
        const pts = attempts===1? lv.points : attempts===2? Math.round(lv.points/2) : 0;
        addScore(lv.id, pts); finished=true;
        b.classList.add('correct');
        opts.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        fbx.innerHTML = fb('good', pts? `Spot on! +${pts}`:'Got there!', o.why);
        if(lv.id==='target') S.target='rut';
        nextBtn(body);
      } else {
        b.classList.add(o.v==='partial'?'partial':'wrong'); b.disabled=true;
        fbx.innerHTML = fb(o.v==='partial'?'partial':'bad', o.v==='partial'?'Close, but not the best choice.':'Not quite.', o.why + ' <i>Try again.</i>');
      }
    };
    opts.appendChild(b);
  });
}

/* sort: one card at a time into buckets */
function playSort(lv, body){
  let i=0, wrongOnThis=false;
  const cards = lv.cards.slice();
  function show(){
    if(i>=cards.length){
      const got = S.perLevel[lv.id]||0;
      body.innerHTML = fb('good', `Level complete: ${got} / ${cards.length*lv.pointsEach} pts`, lv.id==='opps' ? 'Only the opportunities go on the tree. Solutions wait until you have chosen a target, and company needs belong in your outcome, not in the opportunity space.' : lv.id==='structure' ? 'Look at the tree: each branch is a moment in the customer\'s journey, and the children are smaller parts of their parent.' : 'With your assumptions listed and typed, you can decide which ones to test.');
      nextBtn(body); return;
    }
    wrongOnThis=false;
    const c = cards[i];
    body.innerHTML = `<div class="counter">Card ${i+1} of ${cards.length}</div><div class="sortcard">${c.text}</div><div class="buckets"></div><div class="fbx"></div>`;
    const bk = body.querySelector('.buckets'), fbx=body.querySelector('.fbx');
    lv.buckets.forEach(bu=>{
      const b=$(`<button class="bucket">${bu.label}${bu.hint?`<small>${bu.hint}</small>`:''}</button>`);
      b.onclick=()=>{
        if(b.disabled) return;
        if(bu.id===c.a){
          b.classList.add('correct');
          bk.querySelectorAll('.bucket').forEach(x=>x.disabled=true);
          if(!wrongOnThis) addScore(lv.id, lv.pointsEach);
          fbx.innerHTML = fb('good', wrongOnThis?'That\'s it.':`Correct! +${lv.pointsEach}`, c.why);
          const a=$(`<div class="actions"><button class="btn">${i===cards.length-1?'Finish level':'Next card →'}</button></div>`);
          a.querySelector('button').onclick=()=>{i++;show();};
          fbx.appendChild(a); a.querySelector('button').focus({preventScroll:true});
        } else {
          wrongOnThis=true; b.classList.add('wrong'); b.disabled=true;
          fbx.innerHTML = fb('bad','Not quite.','Think about whose point of view it\'s from, and what it\'s really describing. Try another option.');
        }
      };
      bk.appendChild(b);
    });
  }
  show();
}

/* multi: pick N, then submit */
function playMulti(lv, body){
  const sel = new Set();
  body.innerHTML = `<div class="q">Selected: <span id="cnt">0</span> / ${lv.pick}</div><div class="opts"></div><div class="fbx"></div><div class="actions"><button class="btn" id="submit" disabled>Lock in my three</button></div>`;
  const opts = body.querySelector('.opts'), cnt=body.querySelector('#cnt'), submit=body.querySelector('#submit'), fbx=body.querySelector('.fbx');
  const btns = lv.options.map((o,idx)=>{
    const b=$(`<button class="opt" aria-pressed="false"><span>${o.text}</span></button>`);
    b.onclick=()=>{
      if(b.disabled) return;
      if(sel.has(idx)){sel.delete(idx);b.classList.remove('sel');b.setAttribute('aria-pressed','false');}
      else if(sel.size<lv.pick){sel.add(idx);b.classList.add('sel');b.setAttribute('aria-pressed','true');}
      cnt.textContent=sel.size; submit.disabled = sel.size!==lv.pick;
    };
    opts.appendChild(b); return b;
  });
  submit.onclick=()=>{
    let good=0;
    btns.forEach((b,idx)=>{
      const o=lv.options[idx]; b.disabled=true;
      if(sel.has(idx)){ b.classList.remove('sel'); b.classList.add(o.ok?'correct':'wrong'); if(o.ok) good++; }
      else if(o.ok){ b.classList.add('partial'); }
      b.insertAdjacentHTML('beforeend', `<span class="meta">${o.ok?'✓ ':'✗ '}${o.why}</span>`);
    });
    addScore(lv.id, good*lv.pointsEach);
    // Ensure the challenge (used in later levels) is on the tree
    const chosen = lv.options.filter((o,idx)=>sel.has(idx)&&o.ok).map(o=>o.short);
    const pool = lv.options.filter(o=>o.ok).map(o=>o.short);
    const challenge = 'Cook-along challenge with friends';
    let sols = chosen.slice();
    if(!sols.includes(challenge)) sols = [challenge, ...sols];
    for(const p of pool){ if(sols.length>=3) break; if(!sols.includes(p)) sols.push(p); }
    S.solutions = sols.slice(0,3);
    submit.parentElement.remove();
    fbx.innerHTML = fb(good===lv.pick?'good':good>0?'partial':'bad', `${good} of ${lv.pick} address the target · +${good*lv.pointsEach}`,
      good===lv.pick ? 'Every pick connects to your target opportunity. That\'s the tree keeping you honest.' :
      'Ideas outlined in amber also fit the target. Your trio filled the remaining slots with them, including the cook-along challenge, which you\'ll test next.');
    nextBtn(body);
  };
}

function finish(){
  const pct = S.score/MAX;
  const rank = pct>=.9?'🌳 Mighty Oak: you think like a continuous discovery coach.':pct>=.75?'🌲 Sturdy Pine: strong discovery habits.':pct>=.5?'🌿 Growing Sapling: the fundamentals are taking root.':'🌱 Seedling: replay to grow deeper roots.';
  app.innerHTML = `<div class="grid"><section class="card hero" style="padding:26px 20px">
      <div class="eyebrow">Tree complete</div>
      <div class="score-big">${S.score}<span style="font-size:1.2rem;color:var(--muted)"> / ${MAX}</span></div>
      <div class="rank">${rank}</div>
      <div class="recap">${LEVELS.map(l=>{
        const max = l.type==='choice'?l.points:l.type==='multi'?l.pick*l.pointsEach:l.cards.length*l.pointsEach;
        return `<div><span>${l.title}</span><b>${S.perLevel[l.id]||0}/${max}</b></div>`;}).join('')}</div>
      <p style="margin-top:16px">Remember: an OST is never "done". Keep interviewing every week, and keep re-shaping the tree as you learn.</p>
      <div class="actions" style="justify-content:center">
        <button class="btn ghost" id="share">Copy score</button>
        <button class="btn" id="again">Play again</button>
      </div>
    </section>${treePanel()}</div>`;
  document.getElementById('again').onclick=()=>{S=fresh();S.level=0;render();};
  document.getElementById('share').onclick=async(e)=>{
    const t=`I scored ${S.score}/${MAX} growing an Opportunity Solution Tree in "Grow the Tree" 🌳 ${location.href}`;
    try{await navigator.clipboard.writeText(t); e.target.textContent='Copied!';}catch(err){e.target.textContent='Copy failed';}
  };
  requestAnimationFrame(fitTree);
}

render();
</script>
</body>
</html>
